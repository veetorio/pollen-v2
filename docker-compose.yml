services:
  mysql:
    image: mysql:8.4
    container_name: pollen-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pollen
      MYSQL_USER: ettore
      MYSQL_PASSWORD: mylove
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pollen-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pollen?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ettore
      SPRING_DATASOURCE_PASSWORD: mylove
    ports:
      - "8081:8080"

volumes:
  mysql_data: